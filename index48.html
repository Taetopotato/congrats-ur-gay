    .sparkle {

      background: gold;
      border-radius: 50%;
      animation: sparkle 0.8s ease-out forwards;
      pointer-events: none;

    @keyframes sparkle {

  @keyframes pulse {

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(x, y) {
      const colors = ['#ff69b4', '#ffd700', '#00ffff', '#ff00ff', '#00ff00', '#ff4500'];
      for (let i = 0; i < 80; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          radius: Math.random() * 2 + 1
        });
      }
    }

    function animateParticles() {
      ctx.fillStyle = 'rgba(255,240,245,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.01;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function launchFirework() {
      createParticles(window.innerWidth / 2, window.innerHeight / 2);
    }

    noBtn.addEventListener('mouseenter', () => {
      const range = 600;
      const newX = window.innerWidth / 2 + (Math.random() - 0.5) * range;
      const newY = window.innerHeight / 2 + (Math.random() - 0.5) * range;
      noBtn.style.left = Math.max(0, Math.min(window.innerWidth - noBtn.offsetWidth, newX)) + 'px';
      noBtn.style.top = Math.max(0, Math.min(window.innerHeight - noBtn.offsetHeight, newY)) + 'px';
      noBtn.style.transform = 'translate(0,0)';
      noBtn.style.position = 'fixed';
    });

    noBtn.addEventListener('click', () => alert("No? Are you *sure*? 😭 Try clicking 'Yes' instead."));

    yesBtn.addEventListener('click', (e) => {
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
      document.getElementById('termsModal').style.display = 'block';
      sparkle(e.clientX, e.clientY);
    });

    document.getElementById('termsForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('termsModal').style.display = 'none';
      document.getElementById('popup').style.display = 'block';
      launchFirework();
    });

    function sparkle(x, y) {
      for (let i = 0; i < 15; i++) {
        const spark = document.createElement('div');
        spark.className = 'sparkle';
        spark.style.left = `${x + (Math.random() - 0.5) * 100}px`;
        spark.style.top = `${y + (Math.random() - 0.5) * 100}px`;
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 800);
      }
    }
  </script>
